# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main
stages:
- stage: Build
  jobs:
  - job: BuildJob
    pool:
      name: 'MyVM'

    variables:
      solution: '**/*.sln'
      buildConfiguration: 'Release'

    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      displayName: 'Build $(buildConfiguration)'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Run Tests'
      inputs:
        command: 'test'
        projects: '**/*Tests*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - task: DotNetCoreCLI@2
      displayName: 'Publish WPF App'
      inputs:
        command: publish
        publishWebProjects: false
        projects: '**/ClientManager.App.csproj'
        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: false

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)' 
        artifactName: 'ClientManagerApp'


  - job: DeployJob
    pool:
      name: 'MyVM'
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'ClientManagerApp'
        targetPath: '$(Pipeline.Workspace)\app'

    - task: PowerShell@2
      displayName: 'Deploy to Staging'
      inputs:
        targetType: 'inline'
        script: |
          $deployPath = "C:\Deployments\ClientManager\Staging"
          
          if (!(Test-Path $deployPath)) {
              New-Item -ItemType Directory -Path $deployPath -Force
          }
          
          Remove-Item "$deployPath\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          Copy-Item "$(Pipeline.Workspace)\app\*" -Destination $deployPath -Recurse
          
          Write-Host "Deployed to $deployPath"
          Get-ChildItem $deployPath | Format-Table Name, Length