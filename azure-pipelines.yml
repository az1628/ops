stages:
- stage: Build
  jobs:
  - job: BuildJob
    pool:
      name: 'MyVM'
    variables:
      solution: '**/*.sln'
      buildConfiguration: 'Release'
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      displayName: 'Build $(buildConfiguration)'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Run Tests'
      inputs:
        command: 'test'
        projects: '**/*Tests*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - task: DotNetCoreCLI@2
      displayName: 'Publish WPF App'
      inputs:
        command: publish
        publishWebProjects: false
        projects: '**/ClientManager.App.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: false

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'ClientManagerApp'

- stage: Deploy
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DeployJob
    pool:
      name: 'MyVM'
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'ClientManagerApp'
        targetPath: '$(Pipeline.Workspace)\app'

    - script: |
        mkdir C:\Deployments\ClientManager\Staging 2>nul
        del /q /s C:\Deployments\ClientManager\Staging\* 2>nul
        xcopy "$(Pipeline.Workspace)\app\*" "C:\Deployments\ClientManager\Staging\" /E /Y
        dir C:\Deployments\ClientManager\Staging
      displayName: 'Deploy to Staging'